[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkg-docx"
version = "1.0.0"
description = "Generation de documents Word a la charte MKG Consulting (V6)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "MKG Consulting" }]
dependencies = [
    "python-docx>=1.0",
    "Pillow>=9.0",
]

[project.scripts]
mkg-docx = "mkg_docx.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mkg_docx*"]

[tool.setuptools.package-data]
mkg_docx = ["assets/*", "fonts/*", "SKILL.md", "*.md"]